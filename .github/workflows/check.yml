name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run source:check
      - run: npm run build
      - name: Source, documentation and service regression
        run: node scripts/test-groups.mjs core
      - name: Browser playback regression
        run: node scripts/test-groups.mjs browser

  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare ordinary and desktop test builds
        run: npm run pretest
      - name: Desktop lifecycle, persistence and IPC regression
        run: node --import ./tests/helpers/isolated-build.mjs --test --test-concurrency=1 tests/desktop-profile.test.mjs tests/desktop-storage.test.mjs tests/desktop-state.test.mjs tests/desktop-host.test.mjs tests/desktop-lifecycle.test.mjs tests/desktop-state-recovery.test.mjs tests/desktop-restart.test.mjs
